[package]
name = "agentsbar"
version = "0.4.0"
description = "AI coding provider usage limits in the Windows system tray"
authors = ["AgentsBar"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "agentsbar_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-positioner = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
tauri-plugin-log = "2"
tauri-plugin-updater = "2"
tauri-plugin-notification = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
async-trait = "0.1"
ab_glyph = "0.2"
base64 = "0.22"
# Row 35. Hashes the account half of a history series key so a profile email never reaches
# history.json in the clear. Already compiled in the tree under rustls, so this costs no
# additional crate.
sha2 = "0.10"
log = "0.4"
thiserror = "2"
# Browser cookie import. The `rookie` crate was evaluated first and rejected: 189
# transitive crates, and its default `appbound` feature is exactly the app-bound (v20)
# bypass we refuse to ship (it pulls `privilege` for elevation and `rawcopy-rs-next`
# for raw NTFS sector reads). These three do the supported subset in ~300 lines.
rusqlite = { version = "0.40.1", default-features = false, features = ["bundled"] }
aes-gcm = { version = "0.10.3", default-features = false, features = ["aes", "alloc"] }
windows = { version = "0.61.3", features = [
    "Win32_Security_Cryptography",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_System_Com_StructuredStorage",
] }
# HKCU only: drop the pre-rename autostart value, and read the NSIS uninstall key so the
# in-app updater can tell an installed copy from a portable one. Already compiled in the
# tree (embed-resource pulls it), so this costs no additional crate.
winreg = "0.55"

[dev-dependencies]
# Already in the tree under reqwest; named here only so a test can build a canned
# response. Dev only, so the shipped binary is unchanged.
http = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "z"
strip = true

[profile.dev.package."*"]
opt-level = 2
